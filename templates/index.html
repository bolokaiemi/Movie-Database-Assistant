{% extends "base.html" %}

{% block content %}

<style>

/* =========================
   PAGE LAYOUT
========================= */

.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
    background: #141414;
    padding: 60px 20px;
}

/* Shared Section Container */
.container {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}
/* Card Styling */
.card-side-links {
    width: 100%;
    background-color: #06b6d4;
    border: 1px;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    transition: transform 0.2s ease;
    color: black;

}


/* =========================
   MOVIE CARD
========================= */

.movie {
    background: #1c1c1c;
    border-radius: 8px;
    overflow: hidden;
    transition: 0.3s;
    cursor: pointer;
}

.movie:hover {
    transform: scale(1.05);
}

/* =========================
   POSTER
========================= */

.movie-poster {
    width: 100%;
    height: 260px;
    object-fit: cover;
}

/* =========================
   CONTENT
========================= */

.movie-body {
    padding: 10px;
    text-align: center;
}

.movie-body h3 {
    color: #fff;
    font-size: 16px;
    margin-bottom: 6px;
}

.movie-body p {
    color: #bbb;
    font-size: 13px;
    margin: 4px 0;
}

/* =========================
   FLAG
========================= */

.flag {
    width: 20px;
    margin-top: 6px;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    top: 0;
    left: 0;
    z-index: 999;
}

.modal-content {
    background: #222;
    margin: 5% auto;
    padding: 20px;
    width: 80%;
    max-width: 800px;
    border-radius: 10px;
}

.close {
    float: right;
    font-size: 28px;
    cursor: pointer;
    color: white;
}

</style>

<!-- =========================
   MOVIE GRID (DYNAMIC ONLY)
========================= -->

<div class="container">

    {% for movie in movies %}

    <div class="movie" onclick="openModal({{ loop.index0 }})">

        <!-- POSTER -->
        <img class="movie-poster"
             src="{{ movie.poster_url }}"
             alt="{{ movie.title }}">

        <div class="movie-body">

            <h3>{{ movie.title }}</h3>

            <p>⭐ {{ movie.rating }}</p>
            <p>📅 {{ movie.year }}</p>


        </div>
    </div>

    <!-- =========================
         MODAL
    ========================= -->

    <div id="modal{{ loop.index0 }}" class="modal">

        <div class="modal-content">

            <span class="close"
                  onclick="closeModal({{ loop.index0 }})">
                &times;
            </span>

            <h2>{{ movie.title }}</h2>

            {% if movie.trailer_url %}
                <iframe width="100%" height="400"
                        src="{{ movie.trailer_url }}"
                        frameborder="0"
                        allowfullscreen>
                </iframe>
            {% else %}
                <p>No trailer available</p>
            {% endif %}

            <p style="color:#ccc; margin-top:10px;">
                {{ movie.note }}
            </p>

        </div>

    </div>

    {% endfor %}

</div>

<!-- =========================
   JS (MODAL CONTROL)
========================= -->

<script>

function openModal(id) {
    document.getElementById("modal" + id).style.display = "block";
}

function closeModal(id) {
    document.getElementById("modal" + id).style.display = "none";
}

window.onclick = function(event) {
    document.querySelectorAll(".modal").forEach(modal => {
        if (event.target === modal) {
            modal.style.display = "none";
        }
    });
};

</script>

{% endblock %}
