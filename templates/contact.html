{% extends "base.html" %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="container-side-links mt-5">
    <div class="card-side-links">
        <h1 class="text-center mb-4">Contact Us</h1>
        <p class="text-center">We'd love to hear from you! Please fill out the form below, and we'll get back to you as soon as possible.</p>
        
        <form action="{{ url_for('submit_contact') }}" method="POST">
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
