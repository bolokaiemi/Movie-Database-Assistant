
{% extends "base.html" %}

{% block title %}Movie List{% endblock %}

{% block content %}
<section id="movie-list">
    <div class="container mt-5">

        <div class="text-center mb-5">
            <h1>Movie Collection</h1>
            <p>Browse all available movies and select one to view details.</p>
        </div>

        <div class="row">

            {% for movie in movies %}

            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-lg">

                    <img src="{{ movie.poster_url or '/static/image/cinema_luxury.png' }}"
                         class="card-img-top"
                         alt="{{ movie.title }}">

                    <div class="card-body">

                        <h3 class="card-title">
                            {{ movie.title }}
                        </h3>

                        <p class="card-text">
                            {{ movie.description }}
                        </p>

                        <a href="/catalog"
                           class="btn btn-primary">
                            View Details
                        </a>

                    </div>
                </div>
            </div>

            {% endfor %}

        </div>
    </div>
</section>
{% endblock %}
