<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <style>
        body {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #09090e; color: #f3f4f6; margin:0; padding:0; display:flex; justify-content:center; align-items:center; min-height:100vh;}
        .container {max-width:800px; background:#14141d; padding:40px; border-radius:24px; box-shadow:0 20px 40px rgba(0,0,0,0.6); text-align:center;}
        h1 {color:#fff; margin-bottom:20px; font-size:36px;}
        p {color:#cbd5e1; margin-bottom:30px; line-height:1.6;}
        .btn {display:inline-block; margin:10px 5px; padding:12px 24px; background:#ff3d3d; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; box-shadow:0 4px 12px rgba(255,61,61,0.3);}
        .btn:hover {background:#ff1f1f;}
    </style>
</head>
<body>
<div class="container">
    <h1>{{ title }}</h1>
    <p>{{ description }}</p>
    <a href="{{ url_for('serve_presentation') }}" class="btn" target="_blank">View Presentation</a>
    <div style="margin-top:20px;">
        <!-- LinkedIn Share -->
        <a class="btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ request.url_root }}landing" target="_blank">Share on LinkedIn</a>
        <!-- Facebook Share -->
        <a class="btn" href="https://www.facebook.com/sharer/sharer.php?u={{ request.url_root }}landing" target="_blank">Share on Facebook</a>
        <a class="btn"
            href="https://twitter.com/intent/tweet?text=Check%20out%20my%20presentation!&url={{ request.url_root }}landing"
            target="_blank">
            Share on Twitter
        </a>
        <a class="btn"
            href="https://www.pinterest.com/pin/create/button/?url={{ request.url_root }}landing&description=Check%20out%20my%20presentation!"
            target="_blank">
            Share on Pinterest
        </a>
        <a class="btn"
            href="https://api.whatsapp.com/send?text=Check%20out%20my%20presentation!%20{{ request.url_root }}landing"
            target="_blank">
            Share on WhatsApp
            </a>

    </div>
</div>
</body>
</html>
